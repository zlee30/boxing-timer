<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zale timer and stopwatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ── TOP: mode switch button ── -->
  <button class="mode-btn" id="modeSwitchBtn" onclick="switchMode()">STOPWATCH</button>

  <!-- ════════════════════════════════
       TIMER MODE  —  rectangular box
  ════════════════════════════════ -->
  <div id="timerMode">

    <div class="timer-device">

      <!-- Corner screws (decorative) -->
      <div class="screw screw-tl"></div>
      <div class="screw screw-tr"></div>
      <div class="screw screw-bl"></div>
      <div class="screw screw-br"></div>

      <!-- Top bar: brand + status dot -->
      <div class="t-topbar">
        <span class="t-brand-label">Zale</span>
        <span class="t-status-dot" id="tDot"></span>
      </div>

      <!-- LCD screen area -->
      <div class="t-screen">

        <!-- Scanline overlay (handled in CSS) -->

       

        <!-- Main digit row -->
        <div class="t-digit-row">
          <span class="td" id="tH1">0</span><span class="td" id="tH2">0</span>
          <span class="tc off" id="tC1">:</span>
          <span class="td" id="tM1">0</span><span class="td" id="tM2">0</span>
          <span class="tc off" id="tC2">:</span>
          <span class="td" id="tS1">0</span><span class="td" id="tS2">0</span>
          <span class="t-ms" id="tMs">.00</span>
        </div>

        <!-- Rest time + active/rest badge -->
        <div class="t-subrow">
          <div class="rest-block">
            <div class="rest-lbl">Rest</div>
            <div class="rest-val" id="restVal">00:00</div>
          </div>
          <div class="cycle-badge" id="cycleEl"></div>
        </div>

        <!-- Small bottom labels -->
        <div class="t-screen-bot-labels">
          <span>COUNTDOWN</span>
          <span>1/100 SEC</span>
        </div>

      </div><!-- end t-screen -->

      <!-- Brand at bottom of device -->
      <div class="t-brand-bottom">— Zale —</div>

    </div><!-- end timer-device -->


    <!-- Time pickers (shown when SET tapped) -->
    <div class="pickers" id="pickersEl">
      <div class="pick-title">Set Timer</div>
      <div class="pick-row">
        <div class="pick-grp">
          <div class="pick-lbl">Hrs</div>
          <div class="picker">
            <button class="pu" onclick="adj('ph', 1)">▲</button>
            <div class="pv" id="ph">00</div>
            <button class="pd" onclick="adj('ph', -1)">▼</button>
          </div>
        </div>
        <div class="psep">:</div>
        <div class="pick-grp">
          <div class="pick-lbl">Min</div>
          <div class="picker">
            <button class="pu" onclick="adj('pm', 1)">▲</button>
            <div class="pv" id="pm">00</div>
            <button class="pd" onclick="adj('pm', -1)">▼</button>
          </div>
        </div>
        <div class="psep">:</div>
        <div class="pick-grp">
          <div class="pick-lbl">Sec</div>
          <div class="picker">
            <button class="pu" onclick="adj('ps', 1)">▲</button>
            <div class="pv" id="ps">00</div>
            <button class="pd" onclick="adj('ps', -1)">▼</button>
          </div>
        </div>
      </div>

      <div class="pick-subtitle">Set Rest</div>
      <div class="pick-row">
        <div class="pick-grp">
          <div class="pick-lbl">Min</div>
          <div class="picker">
            <button class="pu" onclick="adj('rm', 1)">▲</button>
            <div class="pv bl" id="rm">00</div>
            <button class="pd" onclick="adj('rm', -1)">▼</button>
          </div>
        </div>
        <div class="psep">:</div>
        <div class="pick-grp">
          <div class="pick-lbl">Sec</div>
          <div class="picker">
            <button class="pu" onclick="adj('rs', 1)">▲</button>
            <div class="pv bl" id="rs">00</div>
            <button class="pd" onclick="adj('rs', -1)">▼</button>
          </div>
        </div>
      </div>
    </div><!-- end pickers -->

    <!-- Timer buttons -->
<div class="btn-row-2">
  <button class="gb gs" id="tStartBtn" onclick="tStartStop()">START</button>
  <button class="gb gt" id="tSetBtn"   onclick="tSetToggle()">SET</button>
</div>
<div class="btn-row-2">
  <button class="gb gp-orange" id="tPRBtn" onclick="tPauseResume()" disabled>PAUSE</button>
  <button class="gb gr-reset"  onclick="tReset()">RESET</button>
</div>

  </div><!-- end timerMode -->


  <!-- ════════════════════════════════
       STOPWATCH MODE  —  round body
  ════════════════════════════════ -->
  <div id="stopwatchMode">

    <div class="device-wrap">
      <div class="device-body"></div>

      <!-- Crown / lanyard loop -->
      <div class="device-crown">
        <div class="crown-base"></div>
        <div class="crown-ring"></div>
      </div>

      <!-- Decorative top buttons -->
      <div class="device-topbtns">
        <div class="device-tbtn"></div>
        <div class="device-tbtn"></div>
        <div class="device-tbtn"></div>
      </div>

      <!-- Brand on body -->
      <div class="device-brand">Zale</div>

      <!-- LCD bezel + screen -->
      <div class="device-bezel">
        <div class="device-lcd">
          <div class="lcd-top-labels">
            <span>SPLIT·RESET</span>
            <span>MODE</span>
            <span>START·STOP</span>
          </div>
          <div class="lcd-drow">
            <span class="ld" id="swM1">0</span>
            <span class="ld" id="swM2">0</span>
            <span class="lc off" id="swCol">:</span>
            <span class="ld" id="swS1">0</span>
            <span class="ld" id="swS2">0</span>
            <span class="lms" id="swMs">.00</span>
          </div>
          <div class="lcd-bot-labels">
            <span>CHRONOGRAPH</span>
            <span>1/100 SEC</span>
          </div>
        </div>
      </div>

      <!-- Decorative side button -->
      <div class="device-sidebtn"></div>

      <div class="device-botdetail">ZL-002</div>
    </div>

    <!-- Stopwatch buttons -->
<div class="btn-row-2">
  <button class="gb gs" id="swStartBtn" onclick="swStartStop()">START</button>
  <button class="gb gt" id="swLapBtn"   onclick="swLap()" disabled>LAP</button>
</div>
<div class="btn-row-1">
  <button class="gb gr-reset" onclick="swReset()">RESET</button>
</div>

    <!-- Lap list -->
    <div class="laps-wrap" id="lapsWrap" style="display:none;">
      <div class="laps-hdr">Lap Times</div>
      <div class="laps-grid" id="lapsList"></div>
    </div>

  </div><!-- end stopwatchMode -->

</div><!-- end app -->
<script src="app.js"></script>
</body>
</html>
